<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Adicionar Aluno - Formação Digital</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

<div class="layout">


    <!-- ==========================================
         CONTEÚDO PRINCIPAL
    =========================================== -->

    <main class="main-content">


        <!-- ==========================================
             TOPO
        =========================================== -->

        <header class="topbar">

            <div class="logo">

                <h2>
                    Formação <span>Digital</span>
                </h2>

            </div>


            <div class="admin-area">

                <div class="admin-info">

                    <span>
                        Olá, Administrador!
                    </span>

                    <strong id="nomeAdministrador">
                        Carregando...
                    </strong>

                </div>


                <button
                        id="btnLogout"
                        class="btn-sair"
                >
                    Sair
                </button>

            </div>

        </header>



        <!-- ==========================================
             BOTÃO VOLTAR
        =========================================== -->

        <div class="page-back">

            <button
                    type="button"
                    class="back-button"
                    onclick="window.location.href='../home.html'"
            >
                <span class="back-arrow">←</span>
                Voltar
            </button>

        </div>



        <!-- ==========================================
             CABEÇALHO DA PÁGINA
        =========================================== -->

        <section class="page-hero">

            <div class="page-hero-icon">
                👨‍🎓
            </div>


            <div class="page-hero-content">

                <h1>
                    Adicionar aluno
                </h1>

                <p>
                    Cadastre um novo aluno no Formação Digital.
                </p>

                <div class="page-decoration">

                    <span></span>

                    <strong>🎓</strong>

                    <span></span>

                </div>

            </div>

        </section>



        <!-- ==========================================
             FORMULÁRIO
        =========================================== -->

        <section class="form-container">

            <div class="form-title">

                <div class="form-title-icon">
                    ➕
                </div>


                <div>

                    <h2>
                        Novo aluno
                    </h2>

                    <p>
                        Preencha os dados abaixo para cadastrar o aluno.
                    </p>

                </div>

            </div>


            <form id="formAdicionarAluno">


                <!-- ==================================
                     NOME
                =================================== -->

                <div class="form-group">

                    <label for="nome">
                        Nome do aluno
                    </label>

                    <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite o nome completo"
                            autocomplete="name"
                            required
                    >

                </div>



                <!-- ==================================
                     TURMA
                =================================== -->

                <div class="form-group">

                    <label for="turma">
                        Turma
                    </label>

                    <select
                            id="turma"
                            name="turma"
                            required
                    >

                        <option value="">
                            Carregando turmas...
                        </option>

                    </select>

                    <small>
                        Selecione uma das turmas disponíveis.
                    </small>

                </div>



                <!-- ==================================
                     MENSAGEM
                =================================== -->

                <p
                        id="mensagem"
                        class="mensagem"
                        style="display: none;"
                ></p>



                <!-- ==================================
                     BOTÕES
                =================================== -->

                <div class="acoes">

                    <button
                            type="button"
                            class="btn-secondary"
                            onclick="window.location.href='../home.html'"
                    >
                        <span>←</span>
                        Voltar
                    </button>


                    <button
                            type="submit"
                            class="btn-primary"
                    >
                        Adicionar aluno
                        <span>→</span>
                    </button>

                </div>


            </form>

        </section>


    </main>

</div>



<script>

    const form =
        document.getElementById(
            "formAdicionarAluno"
        );


    const mensagem =
        document.getElementById(
            "mensagem"
        );


    const nomeAdministrador =
        document.getElementById(
            "nomeAdministrador"
        );


    const selectTurma =
        document.getElementById(
            "turma"
        );


    const API =
        "https://formacao-digital-backend.onrender.com";


    // ==========================================
    // VERIFICAR ADMINISTRADOR
    // ==========================================

    async function carregarAdministrador() {

        try {

            const token =
                localStorage.getItem(
                    "tokenAdministrador"
                );


            if (!token) {

                window.location.href =
                    "../login.html";

                return;

            }


            const resposta =
                await fetch(
                    `${API}/api/administrador/me`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            if (!resposta.ok) {

                localStorage.removeItem(
                    "tokenAdministrador"
                );

                localStorage.removeItem(
                    "administrador"
                );

                window.location.href =
                    "../login.html";

                return;

            }


            const dados =
                await resposta.json();


            nomeAdministrador.textContent =
                dados.administrador.nome;


        } catch (erro) {

            console.error(
                "Erro ao verificar administrador:",
                erro
            );


            localStorage.removeItem(
                "tokenAdministrador"
            );

            localStorage.removeItem(
                "administrador"
            );


            window.location.href =
                "../login.html";

        }

    }


    // ==========================================
    // CARREGAR TURMAS
    // ==========================================

    async function carregarTurmas() {

        try {

            const token =
                localStorage.getItem(
                    "tokenAdministrador"
                );


            if (!token) {

                window.location.href =
                    "../login.html";

                return;

            }


            const resposta =
                await fetch(
                    `${API}/api/turmas`,
                    {
                        method: "GET",

                        headers: {
                            "Authorization":
                                `Bearer ${token}`
                        }
                    }
                );


            const dados =
                await resposta.json();


            if (resposta.status === 401) {

                localStorage.removeItem(
                    "tokenAdministrador"
                );

                localStorage.removeItem(
                    "administrador"
                );

                window.location.href =
                    "../login.html";

                return;

            }


            if (!resposta.ok) {

                throw new Error(
                    dados.mensagem ||
                    "Não foi possível carregar as turmas."
                );

            }


            selectTurma.innerHTML = "";


            // OPÇÃO INICIAL

            const opcaoInicial =
                document.createElement(
                    "option"
                );


            opcaoInicial.value = "";

            opcaoInicial.textContent =
                "Selecione uma turma";

            opcaoInicial.disabled = true;

            opcaoInicial.selected = true;


            selectTurma.appendChild(
                opcaoInicial
            );


            // ==================================
            // ADICIONAR TURMAS
            // ==================================

            for (const turma of dados) {

                const opcao =
                    document.createElement(
                        "option"
                    );


                opcao.value =
                    turma.alunos ||
                    turma.abaAlunos ||
                    turma.numero;


                opcao.textContent =
                    turma.nome ||
                    `Turma ${turma.numero}`;


                selectTurma.appendChild(
                    opcao
                );

            }


            // ==================================
            // NENHUMA TURMA
            // ==================================

            if (dados.length === 0) {

                selectTurma.innerHTML = "";


                const opcao =
                    document.createElement(
                        "option"
                    );


                opcao.value = "";

                opcao.textContent =
                    "Nenhuma turma disponível";

                opcao.disabled = true;

                opcao.selected = true;


                selectTurma.appendChild(
                    opcao
                );

            }


        } catch (erro) {

            console.error(
                "Erro ao carregar turmas:",
                erro
            );


            selectTurma.innerHTML = "";


            const opcao =
                document.createElement(
                    "option"
                );


            opcao.value = "";

            opcao.textContent =
                "Erro ao carregar turmas";

            opcao.disabled = true;

            opcao.selected = true;


            selectTurma.appendChild(
                opcao
            );


            mostrarMensagem(
                "Não foi possível carregar as turmas.",
                "erro"
            );

        }

    }


    // ==========================================
    // ADICIONAR ALUNO
    // ==========================================

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const nome =
                document
                    .getElementById("nome")
                    .value
                    .trim();


            const turma =
                document
                    .getElementById("turma")
                    .value;


            // ==================================
            // VALIDAÇÃO
            // ==================================

            if (!nome || !turma) {

                mostrarMensagem(
                    "Preencha todos os campos.",
                    "erro"
                );

                return;

            }


            try {

                const token =
                    localStorage.getItem(
                        "tokenAdministrador"
                    );


                if (!token) {

                    window.location.href =
                        "../login.html";

                    return;

                }


                const resposta =
                    await fetch(
                        `${API}/api/alunos`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json",

                                "Authorization":
                                    `Bearer ${token}`
                            },


                            body:
                                JSON.stringify({
                                    nome: nome,
                                    turma: turma
                                })
                        }
                    );


                const dados =
                    await resposta.json();


                // ==================================
                // TOKEN INVÁLIDO
                // ==================================

                if (resposta.status === 401) {

                    localStorage.removeItem(
                        "tokenAdministrador"
                    );

                    localStorage.removeItem(
                        "administrador"
                    );

                    window.location.href =
                        "../login.html";

                    return;

                }


                // ==================================
                // ERRO
                // ==================================

                if (!resposta.ok) {

                    mostrarMensagem(
                        dados.mensagem ||
                        "Não foi possível cadastrar o aluno.",
                        "erro"
                    );

                    return;

                }


                // ==================================
                // SUCESSO
                // ==================================

                mostrarMensagem(
                    `Aluno ${dados.nome} cadastrado com sucesso! ID: ${dados.id}`,
                    "sucesso"
                );


                // Limpar nome

                document.getElementById(
                    "nome"
                ).value = "";


                // Voltar turma para início

                selectTurma.selectedIndex = 0;


            } catch (erro) {

                console.error(
                    "Erro ao cadastrar aluno:",
                    erro
                );


                mostrarMensagem(
                    "Não foi possível conectar ao servidor.",
                    "erro"
                );

            }

        }
    );


    // ==========================================
    // MOSTRAR MENSAGEM
    // ==========================================

    function mostrarMensagem(
        texto,
        tipo
    ) {

        mensagem.textContent =
            texto;


        mensagem.className =
            `mensagem ${tipo}`;


        mensagem.style.display =
            "block";

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    document
        .getElementById("btnLogout")
        .addEventListener(
            "click",
            function () {

                localStorage.removeItem(
                    "tokenAdministrador"
                );

                localStorage.removeItem(
                    "administrador"
                );


                window.location.href =
                    "../login.html";

            }
        );


    // ==========================================
    // INICIAR
    // ==========================================

    carregarAdministrador();

    carregarTurmas();

</script>


</body>

</html>
